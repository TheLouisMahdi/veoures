name: Verify and publish VEOURES

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node -e "const fs=require('node:fs'),p=require('node:path'),c=require('node:child_process');function check(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(e.name.startsWith('.')||e.name==='_site'||e.name==='node_modules')continue;const f=p.join(d,e.name);if(e.isDirectory())check(f);else if(/\.(?:c|m)?js$/.test(e.name))c.execFileSync(process.execPath,['--check',f],{stdio:'inherit'})}}check('.')"
      - name: Verify deterministic organism
        run: node tests/reducer-check.cjs
      - name: Verify biological geometry and original pack inventory
        run: node tests/biology-check.cjs
      - name: Verify shared server
        run: node tests/server-smoke.cjs
      - name: Package public shared Worker
        run: node hosting/build.mjs
      - name: Verify persistent public runtime
        run: node hosting/tests.mjs
      - name: Package static local demo
        run: node scripts/build-static.cjs
      - name: Check publication artifact
        run: node tests/publication-check.cjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy static local demo
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
